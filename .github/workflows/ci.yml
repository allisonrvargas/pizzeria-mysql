name: CI (valida que el script SQL se ejecute)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar allis.sql
        run: mysql -h 127.0.0.1 -uroot -proot < allis.sql
      - name: Verificar que se crearon las 11 tablas
        run: |
          n=$(mysql -h 127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='pizzeria'")
          echo "Tablas creadas: $n"
          test "$n" -eq 11